spring.application.name=gmailbackend

# Server configuration
# You can override via environment variable SERVER_PORT
server.port=${SERVER_PORT:3001}
server.forward-headers-strategy=framework

# PostgreSQL Database Configuration
# These use environment variables if provided, with defaults suited for the local dev setup
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5001}/${DB_NAME:gmail}}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# Security / JWT
# IMPORTANT: Set via environment variables in deployment; defaults for dev.
security.jwt.secret=${JWT_SECRET:dev-local-jwt-secret-change-me-and-make-it-longer}
security.jwt.expiration-seconds=${JWT_EXP:86400}

# CORS configuration (global) - also reinforced by CorsFilter/SecurityConfig
spring.web.cors.allowed-origins=http://localhost:3000
spring.web.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# Multipart upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# File storage directory (env override FILE_STORAGE_DIR). Defaults to ./attachments at runtime.
file.storage.dir=${FILE_STORAGE_DIR:}
